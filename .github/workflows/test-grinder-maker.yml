name: Test grinder-maker

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/disabled_tests/remove_exclusions.py'
      - 'buildenv/jenkins/retestClosedIssues.groovy'
      - 'scripts/disabled_tests/tests/test_remove_exclusions.py'
      - '.github/workflows/test-grinder-maker.yml'
  pull_request:
    paths:
      - 'scripts/disabled_tests/remove_exclusions.py'
      - 'buildenv/jenkins/retestClosedIssues.groovy'
      - 'scripts/disabled_tests/tests/test_remove_exclusions.py'
      - '.github/workflows/test-grinder-maker.yml'

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python scripts/disabled_tests/tests/test_remove_exclusions.py
