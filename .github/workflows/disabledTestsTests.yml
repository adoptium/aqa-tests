name: 'Disabled Tests Unit Tests'
on:
  pull_request:
    paths:
      - 'scripts/disabled_tests/**'
      - '.github/workflows/disabledTestsTests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitTests:
    runs-on: ubuntu-latest
    env:
      AQA_ISSUE_TRACKER_GITHUB_USER: ${{ github.actor }}
      AQA_ISSUE_TRACKER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          pip install -r scripts/disabled_tests/requirements.txt

      - name: Discover and run all unit tests
        run: |
          cd scripts/disabled_tests
          python3 -m unittest discover -s tests -v
