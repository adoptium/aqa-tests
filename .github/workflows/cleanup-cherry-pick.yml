name: Cleanup Cherry-Pick Branch

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.head_ref, 'cherry-pick-')
    steps:
      - name: Delete cherry-pick head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #${PR_NUMBER} closed/merged event received. Checking current PR state..."

          # Query live PR state
          if ! PR_STATE=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.state' 2>&1); then
            echo "::error::Failed to query PR #${PR_NUMBER} state: $PR_STATE"
            exit 1
          fi

          if [ "$PR_STATE" != "closed" ]; then
            echo "PR #${PR_NUMBER} is currently in state '${PR_STATE}', not 'closed'. Skipping branch deletion."
            exit 0
          fi

          echo "PR #${PR_NUMBER} is closed. Checking branch: ${HEAD_BRANCH} (expected SHA: ${EXPECTED_SHA})"

          # Fetch current SHA of the branch ref
          if ! CURRENT_SHA=$(gh api "/repos/${{ github.repository }}/git/ref/heads/${HEAD_BRANCH}" --jq '.object.sha' 2>&1); then
            if echo "$CURRENT_SHA" | grep -q "Not Found"; then
              echo "Branch ${HEAD_BRANCH} does not exist (already deleted), nothing to do."
              exit 0
            fi
            echo "::error::Failed to inspect ref ${HEAD_BRANCH}: $CURRENT_SHA"
            exit 1
          fi

          # If the branch has moved to a new commit (e.g. recreated by a newer cherry-pick), do not delete it
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Branch ${HEAD_BRANCH} SHA ($CURRENT_SHA) does not match closed PR head SHA ($EXPECTED_SHA). Skipping deletion to prevent removing an active/recreated branch."
            exit 0
          fi

          # A closed PR is not necessarily the last PR using this head branch.
          if ! OPEN_PRS=$(gh api --method GET --paginate "/repos/${{ github.repository }}/pulls" \
            -f state=open -f "head=${{ github.repository_owner }}:${HEAD_BRANCH}" \
            --jq '.[].number' 2>&1); then
            echo "::error::Failed to check open PRs for ${HEAD_BRANCH}: $OPEN_PRS"
            exit 1
          fi
          if [ -n "$OPEN_PRS" ]; then
            echo "Branch ${HEAD_BRANCH} is still used by open PR(s): $OPEN_PRS. Skipping deletion."
            exit 0
          fi

          echo "Deleting cherry-pick branch: ${HEAD_BRANCH}"
          gh api --method DELETE "/repos/${{ github.repository }}/git/refs/heads/${HEAD_BRANCH}"
