name: Cleanup Cherry-Pick Branch

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'cherry-pick-')
    steps:
      - name: Delete cherry-pick head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "PR closed/merged. Deleting branch: ${HEAD_BRANCH}"
          gh api --method DELETE "/repos/${{ github.repository }}/git/refs/heads/${HEAD_BRANCH}" || true
